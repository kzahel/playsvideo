packages:
  - 'app'

onlyBuiltDependencies:
  - '@firebase/util'
  - esbuild
  - protobufjs
  - re2
  - workerd

overrides:
  # Firestore pins an old gRPC client; keep the compatible 1.x API patched.
  '@firebase/firestore>@grpc/grpc-js': '1.14.6'
  # Pub/Sub only uses W3CTraceContextPropagator, retained in the patched 2.x API.
  '@google-cloud/pubsub>@opentelemetry/core': '2.12.0'
  # Gaxios uses v4(); uuid 11 retains CommonJS support and fixes buffer bounds.
  'gaxios>uuid': '11.1.1'
