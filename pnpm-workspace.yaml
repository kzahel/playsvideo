packages:
  - 'app'

onlyBuiltDependencies:
  - '@firebase/util'
  - esbuild
  - protobufjs
  - re2
  - workerd

overrides:
  # Firestore pins an old gRPC client; keep the compatible 1.x API patched.
  '@firebase/firestore>@grpc/grpc-js': '1.14.6'
  # Pub/Sub only uses W3CTraceContextPropagator, retained in the patched 2.x API.
  '@google-cloud/pubsub>@opentelemetry/core': '2.12.0'
  # Gaxios uses v4(); uuid 11 retains CommonJS support and fixes buffer bounds.
  'gaxios>uuid': '11.1.1'

auditConfig:
  ignoreGhsas:
    # firebase-tools (deploy CLI, dev-only) pins glob/minimatch below the fixed
    # majors. Abort-signal traversal and globparts ReDoS need attacker-chosen
    # patterns; the CLI only matches our own firebase.json globs.
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
